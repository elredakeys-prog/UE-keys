const E=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=t=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kget(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get('key');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function kset(k){try{const d=await idb();await new Promise(res=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(k,'key');t.oncomplete=res;t.onerror=res})}catch(e){}}
async function kdel(){try{const d=await idb();await new Promise(res=>{const t=d.transaction('k','readwrite');t.objectStore('k').delete('key');t.oncomplete=res;t.onerror=res})}catch(e){}}
async function derive(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function dec(key){
 const all=b64(BLOB),iv=all.slice(0,12),ct=all.slice(12);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
 return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
function show(html){document.open();document.write(html);document.close()}
async function tryRemembered(){const k=await kget();if(!k)return false;let h;try{h=await dec(k)}catch(e){await kdel();return false}show(h);return true}
async function unlock(){
 const m=E('m'),btn=E('go');m.textContent='';
 if(!(window.crypto&&crypto.subtle)){m.textContent='افتح الرابط من Chrome (https) علشان يشتغل';return}
 const p=E('pw').value;if(norm(p).length<8){m.textContent='اكتب الكود كامل';return}
 const rem=E('rm').checked;btn.disabled=true;btn.textContent='جاري الفتح...';
 let k,h;
 try{k=await derive(p);h=await dec(k)}catch(e){btn.disabled=false;btn.textContent='فتح';m.textContent='الكود غلط';return}
 if(rem)await kset(k);
 show(h);
}
window.addEventListener('DOMContentLoaded',async()=>{
 if(window.crypto&&crypto.subtle){const ok=await tryRemembered();if(ok)return}
 E('go').onclick=unlock;E('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
});

})();
