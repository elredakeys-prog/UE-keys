<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f86c0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>United Engineers</title>
<meta name="apple-mobile-web-app-title" content="United Engineers">
<meta name="application-name" content="United Engineers">
<style>
:root{--main:#0f86c0;--main2:#0b6a9a;--bg:#f5f1ea;--card:#fff;--txt:#1f2937;--mut:#6b7280;--ok:#15803d;--bad:#b91c1c;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:70px}
header{background:var(--main);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:19px}
header small{opacity:.85}
main{max-width:900px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 1px;font-size:10px;color:var(--mut);font-family:inherit}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--main);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat b{display:block;font-size:20px;margin-top:4px}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;margin-bottom:8px;background:#fff}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--main);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.btn.s{padding:6px 10px;font-size:12px}
.btn.o{background:#fff;color:var(--main);border:1px solid var(--main)}
.btn.d{background:var(--bad)}
.btn.k{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:#e0f2fe;color:#0b6a9a}
.tag.low{background:#fee2e2;color:var(--bad)}
.tag.ok{background:#dcfce7;color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.modal>div{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--main);color:var(--main);background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--main);color:#fff}
.cart-i{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.total{font-size:20px;font-weight:700;color:var(--main);text-align:center;margin:8px 0}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}}
#receipt{display:none}
@media print{#receipt{display:block;font-size:13px}main{display:none}.modal,#splash{display:none!important}}
#splash{position:fixed;inset:0;background:#f9fdff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:min(72vw,340px)}
header .l{display:flex;align-items:center;gap:10px}
.hlogo{width:44px;height:44px;border-radius:8px;background:#fff;object-fit:contain;padding:2px}
.homelogo{mix-blend-mode:multiply;display:block;margin:0 auto 10px;width:150px;max-width:50%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th{position:relative;width:76px;height:76px;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;background:#f9fafb;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover}
.th .x{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 8px;font-size:14px}
.kv b{color:var(--mut);font-weight:600;font-size:12px}
.kv span{overflow-wrap:anywhere}
.sec{font-size:13px;font-weight:700;color:var(--main);margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.secret{cursor:pointer;color:var(--main)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--txt);margin:6px 0}
label.chk input{width:auto;margin:0}
label.btn{display:block;text-align:center;margin:0;color:var(--main);font-size:14px}
label.btn.o{color:var(--main)}
.bars{display:flex;gap:2px;align-items:flex-end;height:120px;padding-top:6px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar i{display:block;width:100%;background:var(--main);border-radius:3px 3px 0 0;min-height:1px}
.bar small{font-size:9px;color:var(--mut);margin-top:2px}
#lock,#ap{position:fixed;inset:0;z-index:100;display:none;overflow:auto;padding:20px;background:var(--bg)}
#ap{z-index:120;background:rgba(0,0,0,.65)}
.apbox{background:var(--card);max-width:380px;margin:8vh auto 0;border-radius:14px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
body.nocost .costcol{display:none}
</style>
</head>
<body>
<div id="splash"><img class="logo" alt=""><h1 id="spName" style="margin:6px 0 0;color:var(--main2);font-size:24px;text-align:center">الحاجة أم رضا للمفاتيح</h1><div style="font-weight:700;color:#444;font-size:18px;letter-spacing:1px;direction:ltr">United Engineers</div><button class="btn" onclick="hideSplash()">دخول</button></div>
<header><div class="l"><img class="logo hlogo" alt=""><div><h1><span id="shopName">الحاجة أم رضا للمفاتيح</span></h1><small id="today"></small><small style="display:block;opacity:.9;font-weight:700;direction:ltr;text-align:right">United Engineers</small></div></div><div style="display:flex;gap:6px;align-items:center"><small id="who"></small><button class="btn s o" onclick="lockNow()">🔒</button><button class="btn s o" onclick="go('settings')">⚙️</button></div></header>
<main id="app"></main>
<div id="receipt"></div>
<nav>
<button data-p="home" class="on" onclick="go('home')"><span>🏠</span>الرئيسية</button>
<button data-p="sell" onclick="go('sell')"><span>🛒</span>بيع</button>
<button data-p="stock" onclick="go('stock')"><span>📦</span>المخزون</button>
<button data-p="cust" onclick="go('cust')"><span>👥</span>العملاء</button>
<button data-p="supp" onclick="go('supp')"><span>🏭</span>الموردين</button>
<button data-p="exp" onclick="go('exp')"><span>💸</span>مصروفات</button>
<button data-p="rep" onclick="go('rep')"><span>📊</span>تقارير</button>
</nav>
<div id="lock"></div><div id="ap"></div>
<div class="modal" id="modal"><div id="modalBody"></div></div>
<div class="modal" id="viewer" style="z-index:30"><div id="viewerBody"></div></div>

<script>
// ============ التخزين ============
const KEY='keyshop_v1';
const def={settings:{shop:'الحاجة أم رضا للمفاتيح',phone:'',cur:'ج.م',low:5},items:[],customers:[],cars:[],suppliers:[],purchases:[],supPay:[],sales:[],expenses:[],losses:[],payroll:[],workers:[],diary:[],users:[],approval:null,sections:null,carDB:null,log:[],moves:[],closings:[],custPay:[],voids:[],seal:null,lockInfo:{},seq:1};
let DB=load();
try{const sn=(DB.settings.shop||'').trim();if(!sn||sn==='محل المفاتيح'||sn==='محل مفاتيح'||sn==='أم رضا للمفاتيح'){DB.settings.shop='الحاجة أم رضا للمفاتيح'}}catch(e){}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d?Object.assign(structuredClone(def),d):structuredClone(def)}catch(e){return structuredClone(def)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){if(!save.w){save.w=1;alert('تحذير: مش قادر أحفظ البيانات على الجهاز ('+(e&&e.name)+'). افتح الملف من Chrome أو Safari مباشرة.')}}}
const uid=()=>DB.seq++;
const $=s=>document.querySelector(s);
const cur=()=>DB.settings.cur;
const money=n=>(Math.round((+n||0)*100)/100).toLocaleString('ar-EG')+' '+cur();
const dkey=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CATS=['مفتاح عادي','مفتاح سيارة','ريموت / كارت','كالون / قفل','خزنة','إكسسوار','أخرى'];
const SERVICES=[
['نسخ مفتاح عادي',10,0,'نسخ مفاتيح'],['نسخ مفتاح مسطح / أمان',30,0,'نسخ مفاتيح'],['قص مفتاح بالكود (Key Code)',150,0,'نسخ مفاتيح'],
['نسخ مفتاح بشريحة + برمجة (فيه مفتاح شغال)',400,0,'مفاتيح سيارات'],['إضافة ريموت + برمجة (فيه مفتاح شغال)',450,0,'مفاتيح سيارات'],['برمجة ريموت فقط',200,0,'مفاتيح سيارات'],
['ضايع مفتاح — عمل مفتاح من عدم (كل المفاتيح ضايعة)',1500,0,'مفاتيح سيارات'],['ضايع مفتاح بصمة (Smart Key / Push Start) من عدم',3000,0,'مفاتيح سيارات'],
['مسح المفاتيح القديمة وبرمجة جديدة',300,0,'مفاتيح سيارات'],['استخراج مفتاح مكسور من السويتش',150,0,'مفاتيح سيارات'],['فتح سيارة بدون مفتاح',200,0,'مفاتيح سيارات'],['إصلاح / تغيير سويتش تشغيل',400,0,'مفاتيح سيارات'],
['فتح باب شقة',150,0,'أقفال وأبواب'],['تغيير كالون',100,0,'أقفال وأبواب'],['صيانة قفل',60,0,'أقفال وأبواب'],['فتح خزنة',400,0,'أقفال وأبواب'],
['رسوم انتقال (خدمة خارج المحل)',100,0,'رسوم'],['رسوم طوارئ / وقت متأخر',100,0,'رسوم']
];

// ============ التنقل ============
let page='home',cart=[],PST=[],NAVBACK=false;
function go(p){if(!ME)return;if(!guardPage(p))return;if(p!==page&&!NAVBACK){PST.push(page);if(PST.length>30)PST.shift()}page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===(p==='loss'?'sell':p==='moves'?'stock':p)));render();window.scrollTo(0,0)}
function render(){
 $('#shopName').textContent=DB.settings.shop;
 $('#today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 ({home:rHome,sell:rSell,stock:rStock,cust:rCust,supp:rSupp,exp:rExp,rep:rRep,settings:rSettings,moves:rMoves,log:rLog,users:rUsers,close:rClose,loss:rLoss})[page]();
 if(page==='home')$('#app').insertAdjacentHTML('afterbegin','<img class="logo homelogo" alt="">');
 if(page==='home'&&can('suppliers'))homeSupp();
 initLogo();envWarn();applyView();
}
function openModal(h){$('#modalBody').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

// ============ الحسابات ============
const saleTotal=s=>s.lines.reduce((a,l)=>a+l.price*l.qty,0)-(s.discount||0);
const saleCost=s=>s.lines.reduce((a,l)=>a+(l.cost||0)*l.qty,0);
function inRange(d,from,to){return d>=from&&d<=to}
function summary(from,to){
 const S=DB.sales.filter(s=>inRange(s.date,from,to));
 const rev=S.reduce((a,s)=>a+saleTotal(s),0);
 const cost=S.reduce((a,s)=>a+saleCost(s),0);
 const exp=DB.expenses.filter(e=>inRange(e.date,from,to)).reduce((a,e)=>a+e.amount,0),loss=lossSum(from,to),wages=wageSum(from,to);
 const paid=S.reduce((a,s)=>a+(s.paid??saleTotal(s)),0);
 return{count:S.length,rev,cost,exp,loss,wages,profit:rev-cost-exp-loss-wages,debt:rev-paid}
}

// ============ الرئيسية ============
function rHome(){
 const t=dkey(),m=t.slice(0,8)+'01';
 const d=summary(t,t),mo=summary(m,'9999');
 const low=DB.items.filter(i=>!i.service&&i.qty<=DB.settings.low);
 const debts=DB.customers.map(c=>({c,d:custDebt(c.id)})).filter(x=>x.d>0);
 $('#app').innerHTML=`
 <div class="grid">
  <div class="stat g">مبيعات النهارده<b>${money(d.rev)}</b></div>
  <div class="stat">عدد العمليات<b>${d.count}</b></div>
  <div class="stat g">صافي ربح النهارده<b>${money(d.profit)}</b></div>
  <div class="stat r">مصروفات النهارده (شامل المرتبات)<b>${money(d.exp+d.wages)}</b></div>
  <div class="stat r">هالك وخسارة النهارده<b>${money(d.loss)}</b></div>
 </div>
 <div class="card" style="margin-top:12px"><h2>📅 الشهر الحالي</h2>
  <div class="row"><div>مبيعات<br><b>${money(mo.rev)}</b></div><div>مصروفات<br><b>${money(mo.exp)}</b></div><div>مرتبات<br><b>${money(mo.wages)}</b></div><div>هالك<br><b>${money(mo.loss)}</b></div><div>صافي الربح<br><b style="color:${mo.profit>=0?'var(--ok)':'var(--bad)'}">${money(mo.profit)}</b></div></div></div>
 <div class="card"><h2>⚠️ مخزون قليل (${low.length})</h2>
  ${low.length?low.map(i=>`<div class="cart-i"><span>${esc(i.name)}</span><span class="tag low">باقي ${i.qty}</span></div>`).join(''):'<div class="empty">كل حاجة متوفرة ✅</div>'}</div>
 <div class="card"><h2>💰 ديون العملاء (${debts.length})</h2>
  ${debts.length?debts.map(x=>`<div class="cart-i"><span>${esc(x.c.name)} ${x.c.phone?'· '+esc(x.c.phone):''}</span><span class="tag low">${money(x.d)}</span></div>`).join(''):'<div class="empty">مفيش ديون 👍</div>'}</div>
 <div class="card"><h2>🕘 آخر العمليات</h2>${recentSales(8)}</div>`;
}
function recentSales(n){
 const S=[...DB.sales].reverse().slice(0,n);
 if(!S.length)return '<div class="empty">لسه مفيش مبيعات</div>';
 return `<div class="tw"><table><tr><th>#</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th></th></tr>`+S.map(s=>`<tr><td>${s.id}</td><td>${s.date}</td><td>${esc(custName(s.cust))}</td><td>${money(saleTotal(s))}</td><td><button class="btn s o" onclick="viewSale(${s.id})">عرض</button></td></tr>`).join('')+'</table></div>';
}
const custName=id=>id?(DB.customers.find(c=>c.id===id)?.name||'—'):'عميل نقدي';
const custDebt=id=>DB.sales.filter(s=>s.cust===id).reduce((a,s)=>a+(saleTotal(s)-(s.paid??saleTotal(s))),0);

// ============ البيع ============
let sellCat='الكل',sellQ='';
function rSell(){
 const cats=['الكل','خدمات',...SECS()];
 let list=DB.items.filter(i=>(sellCat==='الكل'||(sellCat==='خدمات'?i.service:(i.cat===sellCat||i.grp===sellCat)))&&(!sellQ||i.name.includes(sellQ))&&carFilter(i,sellBrand,sellModel));
 $('#app').innerHTML=`
 <div class="card"><button class="btn" style="width:100%;margin-bottom:8px" onclick="jobWizard()">🔑 شغلانة مفتاح سيارة (قطعة + مصنعية)</button>
 ${lossOk()?'<button class="btn s d" style="width:100%;margin-bottom:8px" onclick="go(\'loss\')">🗑️ هالك وخسارة (تالف / ضايع)</button>':''}<input id="sq" placeholder="🔍 ابحث عن صنف أو خدمة..." value="${esc(sellQ)}" oninput="sellQ=this.value;rSellList()">
 <div class="chips">${cats.map(c=>`<button class="chip ${c===sellCat?'on':''}" data-c="${esc(c)}" onclick="sellCat=this.dataset.c;rSell()">${esc(c)}</button>`).join('')}<button class="chip ${(showCars||sellBrand)?'on':''}" onclick="showCars=!showCars;if(!showCars){sellBrand='';sellModel=''}rSell()">🚗 حسب العربية</button>${can('stockEdit')?'<button class="chip" onclick="sectionsForm()">🗂️ أقسام +</button>':''}</div>
 ${(showCars||sellBrand)?carCard():''}
 <div id="sl"></div></div>
 <div class="card"><h2>✍️ أضف بند بسعرك</h2>
 <div class="chips">
  <button class="chip" onclick="mq('مصنعية','labor')">🔧 مصنعية</button>
  <button class="chip" onclick="mq('رسوم طوارئ','fee')">🚨 طوارئ</button>
  <button class="chip" onclick="mq('رسوم انتقال','fee')">🚗 انتقال</button>
  <button class="chip" onclick="mq('ريموت','part')">📡 ريموت</button>
  <button class="chip" onclick="mq('سلاح (نصل المفتاح)','part')">🗡️ سلاح</button>
  <button class="chip" onclick="mq('','part')">➕ بند تاني</button>
 </div>
 <div id="mf" style="display:none">
  <label>اسم البند</label><input id="mn" placeholder="مثال: مصنعية برمجة / ريموت كيا">
  <div class="row"><div><label>السعر</label><input id="mp" type="number" min="0"></div><div><label>الكمية</label><input id="mc" type="number" value="1" min="1"></div><div><label>تكلفة علينا</label><input id="mk" type="number" min="0" value="0"></div></div>
  <div class="row"><button class="btn k" onclick="mAdd()">+ أضف للفاتورة</button><button class="btn o" onclick="$('#mf').style.display='none'">إلغاء</button></div>
 </div></div>
 <div class="card"><h2>🧾 الفاتورة الحالية</h2><div id="cart"></div></div>`;
 rSellList();rCart();
}
function rSellList(){
 const list=DB.items.filter(i=>(sellCat==='الكل'||(sellCat==='خدمات'?i.service:(i.cat===sellCat||i.grp===sellCat)))&&(!sellQ||i.name.includes(sellQ))&&carFilter(i,sellBrand,sellModel));
 $('#sl').innerHTML=list.length?`<div class="tw"><table>`+list.map(i=>`<tr><td>${esc(i.name)}<br><small style="color:var(--mut)">${i.service?'خدمة':'متاح: '+i.qty}</small></td><td>${money(i.price)}</td><td><button class="btn s" onclick="addCart(${i.id})">+ أضف</button></td></tr>`).join('')+'</table></div>':'<div class="empty">مفيش أصناف. ضيف من تبويب المخزون.</div>';
}
function addCart(id){
 const it=DB.items.find(i=>i.id===id);if(!it)return;
 const l=cart.find(c=>c.id===id);
 if(l){if(!it.service&&l.qty>=it.qty){alert('الكمية المتاحة '+it.qty+' بس');return}l.qty++}
 else{if(!it.service&&it.qty<1){alert('الصنف خلص من المخزون');return}cart.push({id,name:it.name,price:it.price,cost:it.cost||0,qty:1,service:it.service,kind:it.service?(it.grp==='رسوم'?'fee':'labor'):'part'})}
 rCart();
}
function cQty(i,d){const l=cart[i],it=DB.items.find(x=>x.id===l.id);
 l.qty+=d;if(l.qty<=0)cart.splice(i,1);else if(it&&!it.service&&l.qty>it.qty){l.qty=it.qty;alert('الكمية المتاحة '+it.qty+' بس')}rCart()}
function cPrice(i){const p=prompt('السعر الجديد:',cart[i].price);if(p!==null&&!isNaN(+p)&&+p>=0){cart[i].price=+p;rCart()}}
const kindOf=l=>l.kind||(l.service?'labor':'part');
function kindSums(lines){const r={part:0,labor:0,fee:0};lines.forEach(l=>{r[kindOf(l)]+=l.price*l.qty});return r}
function sumsHtml(k){return [['part','🔩 القطع'],['labor','🔧 المصنعية'],['fee','🚨 رسوم (طوارئ / انتقال)']].filter(([x])=>k[x]>0).map(([x,l])=>`<div class="cart-i"><span>${l}</span><b>${money(k[x])}</b></div>`).join('')}
let MK='part';
function mq(name,kind){
 MK=kind;$('#mf').style.display='';$('#mn').value=name;$('#mp').value='';$('#mk').value=0;$('#mc').value=1;
 if(name)$('#mp').focus();else $('#mn').focus();
}
function mAdd(){
 const n=$('#mn').value.trim(),pv=$('#mp').value,p=+pv,q=+$('#mc').value||1,c=+$('#mk').value||0;
 if(!n){alert('اكتب اسم البند');return}
 if(pv===''||!(p>=0)){alert('اكتب السعر');return}
 cart.push({id:0,name:n,price:p,cost:c,qty:q,service:MK!=='part',kind:MK,manual:true});
 $('#mf').style.display='none';rCart();
}
function rCart(){
 const el=$('#cart');if(!el)return;
 if(!cart.length){el.innerHTML='<div class="empty">الفاتورة فاضية</div>';return}
 const k=kindSums(cart),sub=k.part+k.labor+k.fee,ord=['part','labor','fee'];
 el.innerHTML=cart.map((l,i)=>({l,i})).sort((a,b)=>ord.indexOf(kindOf(a.l))-ord.indexOf(kindOf(b.l))).map(({l,i})=>`<div class="cart-i"><div>${esc(l.name)}${l.manual?' <span class="tag">يدوي</span>':''}<br><small onclick="cPrice(${i})" style="color:var(--main)">${money(l.price)} ✏️</small></div>
 <div><button class="btn s o" onclick="cQty(${i},-1)">−</button> <b>${l.qty}</b> <button class="btn s o" onclick="cQty(${i},1)">+</button></div></div>`).join('')
 +`<div class="sec">ملخص الفاتورة</div>${sumsHtml(k)}<div class="total">${money(sub)}</div><div class="row"><button class="btn k" onclick="checkout()">إتمام البيع</button><button class="btn d" onclick="cart=[];rCart()">إلغاء</button></div>`;
}

 openModal(`<h2>إتمام البيع</h2>
 ${sumsHtml(k)}
 <div class="sec">إضافات سريعة بسعرك (اختياري)</div>
 <div class="row"><div><label>🔧 مصنعية</label><input id="ck_l" type="number" min="0" oninput="upTot(${sub})"></div><div><label>🚨 طوارئ</label><input id="ck_e" type="number" min="0" oninput="upTot(${sub})"></div><div><label>🚗 انتقال</label><input id="ck_t" type="number" min="0" oninput="upTot(${sub})"></div></div>
 <label>العميل</label><select id="cc" onchange="pickCars()"><option value="0">عميل نقدي</option>${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>

 <label>خصم</label><input id="cd" type="number" value="0" min="0" oninput="upTot(${sub})">
 <div class="total" id="ct">${money(sub)}</div>
 <label>المدفوع</label><input id="cp" type="number" value="${sub}" min="0">
 <label>طريقة الدفع</label><select id="cm">${payOpts()}</select>
 <small style="color:var(--mut)">لو دفع أقل، الباقي بيتسجل دين على العميل (لازم تختار عميل).</small>
 <label style="margin-top:8px">ملاحظات (موديل العربية / رقم الشقة...)</label><input id="cn">
 <div class="row"><button class="btn k" onclick="doSale(${sub})">تأكيد</button><button class="btn o" onclick="closeModal()">رجوع</button></div>`);

function extrasSum(){return ['ck_l','ck_e','ck_t'].reduce((a,id)=>a+(+($('#'+id)&&$('#'+id).value)||0),0)}
function upTot(sub){const t=sub+extrasSum()-(+$('#cd').value||0);$('#ct').textContent=money(t);$('#cp').value=t}
async function doSale(sub){
 if(!can('sell')){alert('مش مسموح لك بالبيع');return}
 const lines=cart.map(l=>({...l}));
 [['ck_l','مصنعية','labor'],['ck_e','رسوم طوارئ','fee'],['ck_t','رسوم انتقال','fee']].forEach(([id,n,k])=>{
  const v=+($('#'+id).value)||0;if(v>0)lines.push({id:0,name:n,price:v,cost:0,qty:1,service:true,kind:k,manual:true});
 });
 for(const l of lines){const it=l.id&&DB.items.find(i=>i.id===l.id);if(it&&!it.service)l.cost=it.cost||0;
  if(!(l.price>=0)||!(l.qty>0)){alert('بند فيه قيمة غلط');return}
  if(it&&!it.service&&l.qty>it.qty){alert('الكمية المتاحة من '+it.name+' هي '+it.qty+' بس');return}}
 const total0=lines.reduce((a,l)=>a+l.price*l.qty,0),disc=+$('#cd').value||0,paid=+$('#cp').value||0,cust=+$('#cc').value||0,total=total0-disc;
 if(disc<0||paid<0||disc>total0){alert('قيمة الخصم أو المدفوع غلط');return}
 if(paid<total&&!cust){alert('اختار عميل علشان تسجل الباقي دين');return}
 const why=[];
 if(!isOwner()){
  const lim=(ME.perms&&ME.perms.discountPct)||0;
  if(disc>0&&disc>total0*lim/100)why.push('خصم '+money(disc)+' (الحد المسموح '+lim+'%)');
  if(paid<total&&!can('credit'))why.push('بيع آجل — دين '+money(total-paid));
  lines.forEach(l=>{const it=l.id&&DB.items.find(i=>i.id===l.id);
   if(l.manual||!it){if(!can('manualLines'))why.push('بند يدوي: '+l.name+' بسعر '+l.price)}
   else if(l.price!==it.price&&!can('editPrice'))why.push('تغيير سعر '+l.name+' من '+it.price+' إلى '+l.price);
   if(it&&!it.service&&(it.cost||0)>0&&l.price<it.cost)why.push('بيع '+l.name+' بأقل من التكلفة');});
 }
 if(why.length&&!await askOwner('العملية دي محتاجة موافقة المالك',why))return;
 const s={id:uid(),date:dkey(),time:new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),cust,car:+($('#cv')&&$('#cv').value)||0,lines,discount:disc,paid:Math.min(paid,total),paid0:Math.min(paid,total),method:$('#cm').value,note:$('#cn').value,u:ME.id,un:ME.name,tech:+($('#ck_w')&&$('#ck_w').value)||0,techn:personName(+($('#ck_w')&&$('#ck_w').value)||0)};
 lines.forEach(l=>{const it=DB.items.find(i=>i.id===l.id);if(it&&!it.service)moveStock(it,-l.qty,'بيع فاتورة #'+s.id,s.id)});
 DB.sales.push(s);audit('sale',{id:s.id,total,paid:s.paid,disc,cust,method:s.method,h:saleHash(s),...(why.length?{ok:why}:{})});
 cart=[];closeModal();
 viewSale(s.id,true);rSell();
}
function viewSale(id,fresh){
 const s=DB.sales.find(x=>x.id===id);if(!s)return;
 const tot=saleTotal(s);
 openModal(`<h2>${fresh?'✅ تم البيع — ':''}فاتورة #${s.id}</h2>
 <small>${s.date} ${s.time||''} · ${esc(custName(s.cust))}${s.un?' · 👤 '+esc(s.un):''}${s.techn?' · 🔧 '+esc(s.techn):''}</small>
 ${custLines(s).map(l=>`<div class="cart-i"><span>${esc(l.name)} × ${l.qty}</span><span>${money(l.total)}</span></div>`).join('')}
 ${s.discount?`<div class="cart-i"><span>خصم</span><span>- ${money(s.discount)}</span></div>`:''}
 <div class="total">${money(tot)}</div>
 ${(s.paid??tot)>0?`<div style="text-align:center;color:var(--mut)">طريقة الدفع: ${methodLabel(s.method)}</div>`:''}
 ${(s.paid??tot)<tot?`<div style="color:var(--bad);text-align:center">متبقي: ${money(tot-s.paid)}</div>`:''}
 ${s.car&&carLabel(s.car)?`<p>🚗 ${esc(carLabel(s.car))}</p>`:''}${s.note?`<p>📝 ${esc(s.note)}</p>`:''}
 <div class="row"><button class="btn" onclick="printSale(${s.id})">🖨️ طباعة</button><button class="btn o" onclick="saleDetail(${s.id})">🔍 تفاصيل داخلية</button><button class="btn o" onclick="closeModal()">إغلاق</button>${fresh?'':`<button class="btn d" onclick="delSale(${s.id})">حذف</button>`}</div>`);
}
async function delSale(id){
 const s=DB.sales.find(x=>x.id===id);if(!s)return;
 if(!can('voidSale')){if(!await askOwner('إلغاء فاتورة #'+id,['إلغاء فاتورة بقيمة '+money(saleTotal(s))]))return}
 else if(!confirm('إلغاء الفاتورة؟ هيتم إرجاع الكميات للمخزون.'))return;
 s.lines.forEach(l=>{const it=DB.items.find(i=>i.id===l.id);if(it&&!it.service)moveStock(it,+l.qty,'إلغاء فاتورة #'+id,id)});
 DB.voids.push({id,date:dkey(),by:ME.name,total:saleTotal(s),snap:s});
 DB.sales=DB.sales.filter(x=>x.id!==id);audit('void',{id,total:saleTotal(s),lines:s.lines.map(l=>l.name+'×'+l.qty).join('، ')});closeModal();render();
}
// الفاتورة للعميل: من غير مصنعية/رسوم/ربح — الإضافات بتتضاف على سعر البند الأساسي
function custLines(s){
 const L=s.lines.map(l=>({name:l.name,qty:l.qty,total:l.price*l.qty,k:kindOf(l)}));
 for(const base of ['part','labor','fee']){
  const B=L.filter(x=>x.k===base);
  if(B.length){B[0].total+=L.filter(x=>x.k!==base).reduce((a,x)=>a+x.total,0);return B.map(x=>({name:x.name,qty:x.qty,total:x.total}))}
 }
 return [];
}
async function saleDetail(id){
 const s=DB.sales.find(x=>x.id===id);if(!s)return;
 if(!can('reports')&&!await askOwner('عرض تفاصيل فاتورة #'+id,['الاطلاع على تفاصيل الفاتورة الداخلية (المصنعية والرسوم)']))return;
 const tot=saleTotal(s),cost=saleCost(s),ic={part:'🔩',labor:'🔧',fee:'🚨'};
 openModal(`<h2>🔍 تفاصيل داخلية — فاتورة #${s.id}</h2><small style="color:var(--bad)">داخلي — مش بيظهر للعميل ولا في الطباعة</small>
 ${s.lines.map(l=>`<div class="cart-i"><span>${ic[kindOf(l)]} ${esc(l.name)} × ${l.qty}${can('viewCost')&&l.cost?'<br><small style="color:var(--mut)">تكلفة '+money(l.cost*l.qty)+'</small>':''}</span><span>${money(l.price*l.qty)}</span></div>`).join('')}
 <div class="sec">ملخص</div>${sumsHtml(kindSums(s.lines))}${s.discount?`<div class="cart-i"><span>خصم</span><span>- ${money(s.discount)}</span></div>`:''}
 <div class="total">${money(tot)}</div>${can('viewCost')?`<div class="cart-i"><span>الربح</span><b style="color:${tot-cost>=0?'var(--ok)':'var(--bad)'}">${money(tot-cost)}</b></div>`:''}
 <button class="btn o" style="width:100%" onclick="viewSale(${s.id})">رجوع</button>`);
}
function printSale(id){
 const s=DB.sales.find(x=>x.id===id),tot=saleTotal(s);
 $('#receipt').innerHTML=`<div style="text-align:center"><img src="${LOGO}" style="width:90px"><h2>${esc(DB.settings.shop)}</h2><div style="font-size:12px">United Engineers</div>${DB.settings.phone?'<div>📞 '+esc(DB.settings.phone)+'</div>':''}<div>فاتورة #${s.id} · ${s.date}</div></div><hr>
 <table style="width:100%">${custLines(s).map(l=>`<tr><td>${esc(l.name)} × ${l.qty}</td><td style="text-align:left">${money(l.total)}</td></tr>`).join('')}</table><hr>
 ${s.discount?`<div>خصم: ${money(s.discount)}</div>`:''}<h3>الإجمالي: ${money(tot)}</h3>${(s.paid??tot)>0?'<div>طريقة الدفع: '+methodLabel(s.method).replace(/^\S+\s/,'').replace(/\s*\(.*\)/,'')+'</div>':''}${(s.paid??tot)<tot?'<div>المتبقي: '+money(tot-s.paid)+'</div>':''}<div style="text-align:center">شكراً لزيارتكم</div>`;
 window.print();
}

async function saveItem(id){
 const name=$('#fn').value.trim();if(!name){alert('اكتب الاسم');return}
 const svc=$('#ft').value==='1';
 let sec=$('#fc').value;if(sec==='__new'){sec=$('#fcn').value.trim();if(!sec){alert('اكتب اسم القسم');return}if(!SECS().includes(sec)){DB.sections=SECS();DB.sections.push(sec);audit('section','إضافة قسم '+sec)}}
 const o={name,service:svc,cat:svc?'خدمة':sec,qty:svc?0:Math.max(0,+$('#fq').value||0),cost:+$('#fk').value||0,price:+$('#fp').value||0};if(svc)o.grp=sec;
 let br=$('#fbr').value,mo=$('#fmo').value;if(br==='__new')br=$('#fbrn').value.trim();if(mo==='__new')mo=$('#fmon').value.trim();
 if(br){carEnsure(br,mo);o.brand=br;o.model=mo||''}else{o.brand='';o.model=''}
 const old=id?DB.items.find(i=>i.id===id):null,ch=[];
 if(old){if(!o.service&&o.qty!==old.qty)ch.push('كمية '+old.name+': '+old.qty+' → '+o.qty);if(o.price!==old.price)ch.push('سعر البيع '+old.price+' → '+o.price);if(o.cost!==(old.cost||0))ch.push('التكلفة '+(old.cost||0)+' → '+o.cost)}
 else if(!o.service&&o.qty>0)ch.push('صنف جديد '+name+' بكمية '+o.qty);
 if(ch.length&&!can('stockEdit')&&!await askOwner('تعديل صنف',ch))return;
 if(old){const dq=o.service?0:o.qty-old.qty;const q=old.qty;Object.assign(old,o,{qty:q});if(dq)moveStock(old,dq,'تعديل يدوي',0);audit('item',ch.join(' | ')||('تعديل '+name))}
 else{const it={id:uid(),...o,qty:0};DB.items.push(it);if(!o.service&&o.qty>0)moveStock(it,o.qty,'رصيد افتتاحي',0);audit('item','إضافة '+name+(o.qty?' كمية '+o.qty:''))}
 closeModal();rStock();
}
async function delItem(id){const it=DB.items.find(i=>i.id===id);if(!it)return;if(!await askOwner('حذف صنف',['حذف '+it.name]))return;if(!confirm('حذف الصنف؟'))return;DB.items=DB.items.filter(i=>i.id!==id);audit('item','حذف '+it.name);closeModal();rStock()}

let _idb;
function idb(){return _idb||(_idb=new Promise((res,rej)=>{const r=indexedDB.open('keyshop_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function fTx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}
const MEM={},LSP='kf_';
async function fPut(r){
 try{await fTx('readwrite',s=>s.put(r));return 'idb'}catch(e){}
 const data=await b2d(r.blob);
 try{localStorage.setItem(LSP+r.id,JSON.stringify({id:r.id,name:r.name,type:r.type,data}));return 'ls'}catch(e){}
 MEM[r.id]={id:r.id,name:r.name,type:r.type,data};return 'mem';
}
async function fGet(id){
 try{const r=await fTx('readonly',s=>s.get(id));if(r)return r}catch(e){}
 let o=null;try{const t=localStorage.getItem(LSP+id);if(t)o=JSON.parse(t)}catch(e){}
 o=o||MEM[id];
 return o?{id:o.id,name:o.name,type:o.type,blob:d2b(o.data)}:null;
}
async function fDel(id){try{await fTx('readwrite',s=>s.delete(id))}catch(e){}try{localStorage.removeItem(LSP+id)}catch(e){}delete MEM[id]}
async function fAll(){
 let a=[];try{a=(await fTx('readonly',s=>s.getAll()))||[]}catch(e){}
 const seen=new Set(a.map(x=>x.id));
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LSP)){const o=JSON.parse(localStorage.getItem(k));if(!seen.has(o.id)){a.push({id:o.id,name:o.name,type:o.type,blob:d2b(o.data)});seen.add(o.id)}}}}catch(e){}
 for(const id in MEM)if(!seen.has(id)){const o=MEM[id];a.push({id:o.id,name:o.name,type:o.type,blob:d2b(o.data)})}
 return a;
}
async function fClear(){try{await fTx('readwrite',s=>s.clear())}catch(e){}try{Object.keys(localStorage).filter(k=>k.startsWith(LSP)).forEach(k=>localStorage.removeItem(k))}catch(e){}for(const k in MEM)delete MEM[k]}
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function d2b(u){const p=u.split(',');const m=p[0].match(/:(.*?);/)[1];const s=atob(p[1]);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m})}
function shrink(file){return new Promise(res=>{if(!file.type.startsWith('image/'))return res(file);const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.75)};
 img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

function rCustList(){

 const list=DB.customers.filter(c=>!q||(c.name+' '+(c.phone||'')).toLowerCase().includes(q)||custCars(c.id).some(x=>[x.plate,x.vin,x.make,x.model].join(' ').toLowerCase().includes(q)));

  <td>${d>0?`<span class="tag low">${money(d)}</span>`:'—'}</td>

function custForm(id){

function saveCust(id){if(!id&&!can('addCust')){alert('مش مسموح');return}const n=$('#cn1').value.trim();if(!n){alert('اكتب الاسم');return}

async function delCust(id){
 if(custDebt(id)>0){alert('العميل عليه دين، سدده الأول');return}
 if(!await askOwner('حذف عميل',['حذف العميل '+custName(id)+' وملفات عربياته']))return;
 const cs=custCars(id);
 if(!confirm('حذف العميل'+(cs.length?' وكل ملفات عربياته ('+cs.length+')':'')+'؟'))return;
 cs.forEach(c=>(c.files||[]).forEach(f=>fDel(f.id)));
 DB.cars=DB.cars.filter(c=>c.cust!==id);DB.customers=DB.customers.filter(c=>c.id!==id);audit('custdel','حذف عميل رقم '+id);closeModal();rCust()}

function vinHint(el){
 const h=$('#vh');if(!h||!el)return;const v=el.value.trim().toUpperCase();
 if(!v){h.textContent='';return}
 const ok=/^[A-HJ-NPR-Z0-9]{17}$/.test(v);
 h.style.color=ok?'var(--ok)':'#b45309';
 h.textContent=ok?'✔ رقم شاسيه سليم الشكل (17 خانة)':'⚠ المفروض 17 خانة حروف وأرقام بدون I و O و Q (الحالي '+v.length+') — راجع الرقم';
}

async function addFiles(fl){
 fl=[...fl];
 for(const f of fl){
  if(f.size>25*1024*1024){alert(f.name+' كبير (أكتر من 25 ميجا)');continue}
  const b=await shrink(f),id='f'+uid()+'_'+Date.now(),type=b.type||f.type||'application/octet-stream';
  let mode;try{mode=await fPut({id,name:f.name,type,blob:b})}catch(e){alert('تعذر حفظ الملف '+f.name+' ('+((e&&e.message)||e)+')');continue}
  if(mode!=='idb'&&!addFiles.w){addFiles.w=1;alert(mode==='ls'?'الملف اتحفظ بطريقة بديلة (مساحة محدودة). الأفضل تفتح البرنامج من Chrome أو Safari مباشرة.':'التخزين الدائم للملفات مش شغال هنا — الملف هيفضل لحد ما تقفل الصفحة بس. افتح البرنامج من Chrome أو Safari مباشرة.')}
  CD.files.push({id,name:f.name,type});CNEW.push(id);
 }
 drawFiles(CD.files,'a_files',true);
}
async function addFolder(fl){
 fl=[...fl];
 if(!fl.length){alert('المتصفح ما رجّعش ملفات من المجلد. جرب "اختيار ملف" وحدد كل الملفات من جوه المجلد.');return}
 const MAX=100;
 if(fl.length>MAX&&!confirm('المجلد فيه '+fl.length+' ملف. هضيف أول '+MAX+' بس. تكمل؟'))return;
 const list=fl.slice(0,MAX);let n=0,big=0;const p=$('#a_prog');
 for(const f of list){
  if(p)p.textContent='جاري الإضافة '+(n+1)+' / '+list.length+' ...';
  if(f.size>25*1024*1024){big++;continue}
  const nm=f.webkitRelativePath||f.name,b=await shrink(f),id='f'+uid()+'_'+Date.now(),type=b.type||f.type||'application/octet-stream';
  try{await fPut({id,name:nm,type,blob:b})}catch(e){continue}
  CD.files.push({id,name:nm,type});CNEW.push(id);n++;
  if(n%5===0)drawFiles(CD.files,'a_files',true);
 }
 if(p)p.textContent='';
 drawFiles(CD.files,'a_files',true);
 alert('تمت إضافة '+n+' ملف'+(big?' — '+big+' ملف أكبر من 25 ميجا اتخطّيته':'')+(fl.length>MAX?' — وباقي المجلد ضيفه في مرة تانية':''));
}
async function drawFiles(list,elId,rm){
 const el=$('#'+elId);if(!el)return;
 const parts=[];
 for(const m of list||[]){
  const rec=await fGet(m.id);
  const th=rec&&rec.type&&rec.type.startsWith('image/')?`<img src="${URL.createObjectURL(rec.blob)}" onclick="openFile('${m.id}')">`:`<span onclick="openFile('${m.id}')">${/\.(zip|rar|7z)$/i.test(m.name)?'🗜️':/\.(docx?|txt)$/i.test(m.name)?'📝':/\.(xlsx?|csv)$/i.test(m.name)?'📊':'📄'}<br>${esc(m.name.split('/').pop().slice(0,14))}</span>`;
  parts.push(`<div class="th">${th}${rm?`<button class="x" onclick="rmFile('${m.id}')">✕</button>`:''}</div>`);
 }
 el.innerHTML=parts.join('')||'<small style="color:var(--mut)">لا توجد مرفقات</small>';
}
function rmFile(id){CD.files=CD.files.filter(f=>f.id!==id);drawFiles(CD.files,'a_files',true)}
async function openFile(id){
 const r=await fGet(id);if(!r){alert('الملف مش موجود');return}
 const u=URL.createObjectURL(r.blob);
 const body=r.type&&r.type.startsWith('image/')?`<img src="${u}" style="width:100%;border-radius:8px">`:`<div class="empty">📄 ${esc(r.name)}</div>`;
 $('#viewerBody').innerHTML=`<h2>${esc(r.name)}</h2>${body}<div class="row" style="margin-top:10px"><a class="btn k" style="text-align:center;text-decoration:none" href="${u}" download="${esc(r.name)}" target="_blank">فتح / تنزيل</a><button class="btn o" onclick="$('#viewer').classList.remove('show')">إغلاق</button></div>`;
 $('#viewer').classList.add('show');
}
function saveCar(){
 const g=k=>$('#a_'+k).value.trim();
 const o={make:g('make'),model:g('model'),year:g('year'),color:g('color'),plate:g('plate'),engine:g('engine'),vin:g('vin').toUpperCase(),ktype:$('#a_ktype').value,kcount:g('kcount'),chip:g('chip'),freq:g('freq'),blade:g('blade'),kcode:g('kcode'),pin:g('pin'),lost:$('#a_lost').checked,own:$('#a_own').checked,notes:g('notes')};
 if(!o.make&&!o.model&&!o.plate&&!o.vin){alert('اكتب ماركة أو لوحة أو شاسيه على الأقل');return}
 if(o.vin&&DB.cars.some(c=>c.vin===o.vin&&c.id!==CD.id)&&!confirm('رقم الشاسيه ده متسجل قبل كده على عربية تانية. تكمل؟'))return;
 Object.assign(CD,o);
 COLD.filter(id=>!CD.files.some(f=>f.id===id)).forEach(fDel);
 const i=DB.cars.findIndex(c=>c.id===CD.id);if(i>=0)DB.cars[i]=CD;else DB.cars.push(CD);
 save();const id=CD.id;CD=null;CNEW=[];carView(id);
}
function cancelCar(){
 CNEW.forEach(fDel);const c=CD;CD=null;CNEW=[];
 if(c&&DB.cars.some(x=>x.id===c.id))carView(c.id);else closeModal();
}

function carView(id){
 const c=DB.cars.find(x=>x.id===id);if(!c)return;
 const cu=DB.customers.find(x=>x.id===c.cust);
 const hist=DB.sales.filter(s=>s.car===id).reverse();
 const kv=CAR_FIELDS.map(([k,l])=>{
  if(!c[k])return'';
  return SECRET.includes(k)?`<b>${l}</b><span class="secret" data-v="${esc(c[k])}" onclick="this.textContent=this.dataset.v">اضغط للإظهار 👁</span>`:`<b>${l}</b><span>${esc(c[k])}</span>`;
 }).join('');
 openModal(`<h2>🚗 ${esc(carName(c))}</h2>
 <small>${esc(cu?cu.name:'—')}${cu&&cu.phone?' · '+esc(cu.phone):''}</small>
 <div class="kv" style="margin-top:8px">${kv}${c.lost?'<b>الحالة</b><span>ضاعت كل المفاتيح</span>':''}${c.own?'<b>الملكية</b><span>تم التأكد ✔</span>':''}</div>
 ${c.notes?`<p>📝 ${esc(c.notes)}</p>`:''}
 <div class="sec">المرفقات</div><div class="thumbs" id="v_files"></div>
 <div class="sec">سجل الشغل (${hist.length})</div>
 ${hist.map(s=>`<div class="cart-i"><span>${s.date} · ${esc(s.lines.map(l=>l.name).join('، '))}</span><b>${money(saleTotal(s))}</b></div>`).join('')||'<div class="empty">لا يوجد شغل مسجل</div>'}
 <div class="row" style="margin-top:12px"><button class="btn k" onclick="startSale(${c.cust},${c.id})">🛒 شغل جديد</button><button class="btn" onclick="carForm(${c.cust},${c.id})">✏️ تعديل</button></div>

function delCar(id){
 if(!confirm('حذف ملف العربية بكل مرفقاته؟'))return;
 const c=DB.cars.find(x=>x.id===id);const cu=c.cust;

 DB.cars=DB.cars.filter(x=>x.id!==id);save();custCarsModal(cu);
}

 <div>العميل: <b>${esc(cu?cu.name:'—')}</b> ${cu&&cu.phone?'· '+esc(cu.phone):''}</div><div>تاريخ الملف: ${esc(c.date||'')}</div><hr>

async function exportCar(id){
 const c=DB.cars.find(x=>x.id===id),cu=DB.customers.find(x=>x.id===c.cust);
 const files=[];for(const m of c.files||[]){const r=await fGet(m.id);if(r)files.push({name:m.name,type:r.type,data:await b2d(r.blob)})}
 const out={kind:'keyshop-car',v:1,exported:dkey(),shop:DB.settings.shop,customer:cu?{name:cu.name,phone:cu.phone}:null,
  car:{...c,files:undefined,cust:undefined,id:undefined},files,
  history:DB.sales.filter(s=>s.car===id).map(s=>({date:s.date,total:saleTotal(s),items:s.lines.map(l=>l.name+'×'+l.qty).join(' + '),note:s.note||''}))};
 shareModal('ملف_عربية_'+(c.plate||c.vin||id)+'.json',JSON.stringify(out,null,1),'ملف العربية جاهز','application/json');
}
let XF=null;
function xmsg(m){const e=$('#xmsg');if(e)e.textContent=m}
function shareModal(name,text,title,type){
 XF={name,text,type:type||'application/json'};
 openModal(`<h2>✅ ${esc(title)}</h2><p style="font-size:13px;color:var(--mut)">${esc(name)} — ${Math.max(1,Math.round(text.length/1024))} KB</p>
 <div class="row"><button class="btn k" onclick="doShare()">📤 مشاركة / حفظ</button><button class="btn o" onclick="doDownload()">⬇️ تنزيل</button></div>
 <button class="btn o" style="width:100%;margin-top:8px" onclick="doCopy()">📋 نسخ المحتوى</button>
 ${window.showDirectoryPicker?'<button class="btn o" style="width:100%;margin-top:8px" onclick="doSaveFolder()">💾 حفظ في مجلد أختاره</button>':''}
 <div id="xmsg" style="font-size:13px;margin:10px 0;color:var(--main2)"></div>
 <button class="btn o" onclick="closeModal()" style="width:100%">إغلاق</button>`);
}
async function doShare(){
 for(const t of [XF.type,'text/plain']){

let RM='month',RREF=dkey(),rFrom=null,rTo=null;
const fmtD=(s,o)=>new Date(s+'T12:00:00').toLocaleDateString('ar-EG',o||{day:'numeric',month:'short'});
function rangeOf(mode,ref){
 const d=new Date(ref+'T12:00:00');
 if(mode==='day')return[ref,ref];
 if(mode==='week'){const wd=(d.getDay()+1)%7,s=new Date(d);s.setDate(d.getDate()-wd);const e=new Date(s);e.setDate(s.getDate()+6);return[dkey(s),dkey(e)]}
 if(mode==='month'){const y=d.getFullYear(),m=d.getMonth();return[dkey(new Date(y,m,1,12)),dkey(new Date(y,m+1,0,12))]}
 if(mode==='year'){const y=d.getFullYear();return[y+'-01-01',y+'-12-31']}
 return[rFrom||dkey(),rTo||dkey()];
}
function shiftRef(mode,ref,dir){
 const d=new Date(ref+'T12:00:00');
 if(mode==='day')d.setDate(d.getDate()+dir);
 else if(mode==='week')d.setDate(d.getDate()+7*dir);
 else if(mode==='month')d.setMonth(d.getMonth()+dir,1);
 else if(mode==='year')d.setFullYear(d.getFullYear()+dir);
 return dkey(d);
}
function rangeLabel(mode,f,t){
 if(mode==='day')return fmtD(f,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 if(mode==='month')return fmtD(f,{month:'long',year:'numeric'});
 if(mode==='year')return fmtD(f,{year:'numeric'});
 return 'من '+fmtD(f,{day:'numeric',month:'short',year:'numeric'})+' إلى '+fmtD(t,{day:'numeric',month:'short',year:'numeric'});
}
function fullStats(from,to){
 const S=DB.sales.filter(x=>inRange(x.date,from,to));
 let parts=0,labor=0,fees=0,costP=0,costL=0,disc=0,total=0,paid=0;
 S.forEach(s=>{
  s.lines.forEach(l=>{const v=l.price*l.qty,c=(l.cost||0)*l.qty;if(l.service){if(kindOf(l)==='fee')fees+=v;else labor+=v;costL+=c}else{parts+=v;costP+=c}});
  disc+=s.discount||0;const t=saleTotal(s);total+=t;paid+=Math.min(s.paid??t,t);
 });
 const exp=DB.expenses.filter(e=>inRange(e.date,from,to)).reduce((a,e)=>a+e.amount,0),loss=lossSum(from,to),wages=wageSum(from,to);
 const P=DB.purchases.filter(p=>inRange(p.date,from,to));
 const purTotal=P.reduce((a,p)=>a+p.total,0);
 const supPaid=P.reduce((a,p)=>a+(p.paid||0),0)+DB.supPay.filter(x=>inRange(x.date,from,to)).reduce((a,x)=>a+x.amount,0);
 const byM={};S.forEach(s=>{const m=s.method||'cash';byM[m]=(byM[m]||0)+(s.paid0??s.paid??saleTotal(s))});DB.custPay.filter(x=>inRange(x.date,from,to)).forEach(x=>{const m=x.method||'cash';byM[m]=(byM[m]||0)+x.amount});
 return{byM,S,count:S.length,parts,labor,fees,costP,costL,disc,total,paid,debt:total-paid,exp,loss,wages,L:DB.losses.filter(x=>inRange(x.date,from,to)),profit:total-costP-costL-exp-loss-wages,purTotal,supPaid};
}
function buckets(mode,from,to,S){
 const b=[];
 if(mode==='year'){
  const y=+from.slice(0,4);
  for(let m=1;m<=12;m++)b.push({k:y+'-'+String(m).padStart(2,'0'),l:new Date(y,m-1,1).toLocaleDateString('ar-EG',{month:'short'}),v:0});
  S.forEach(s=>{const x=b.find(z=>z.k===s.date.slice(0,7));if(x)x.v+=saleTotal(s)});
 }else{
  const d=new Date(from+'T12:00:00'),e=new Date(to+'T12:00:00');let n=0;
  while(d<=e&&n<400){b.push({k:dkey(d),l:String(d.getDate()),v:0});d.setDate(d.getDate()+1);n++}
  S.forEach(s=>{const x=b.find(z=>z.k===s.date);if(x)x.v+=saleTotal(s)});
 }
 return b;
}

function purSave(){

 });

async function purDel(id){

 DB.purchases=DB.purchases.filter(x=>x.id!==id);audit('purdel',{id,total:p.total});supView(p.supplier);
}

 DB.supPay.filter(p=>p.supplier===id).forEach(p=>rows.push({d:p.date,t:'سداد'+(p.note?' — '+p.note:''),a:0,k:p.amount}));
 rows.sort((x,y)=>x.d.localeCompare(y.d));
 let bal=0;
 const body=rows.map(r=>{bal+=r.a-r.k;return`<tr><td>${r.d}</td><td>${esc(r.t)}</td><td>${r.a?money(r.a):''}</td><td>${r.k?money(r.k):''}</td><td>${money(bal)}</td></tr>`}).join('');
 $('#receipt').innerHTML=`<div style="text-align:center"><img src="${LOGO}" style="width:80px"><h2>${esc(DB.settings.shop)}</h2><h3>كشف حساب مورد: ${esc(s.name)}</h3><div>${dkey()}</div></div>

 window.print();
}

// ============ الأمان والرقابة ============
const SHA_K=(()=>{const k=[];let n=2;while(k.length<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p)k.push(Math.floor((Math.cbrt(n)%1)*4294967296)>>>0);n++}return k})();
const SHA_H=(()=>{const k=[];let n=2;while(k.length<8){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p)k.push(Math.floor((Math.sqrt(n)%1)*4294967296)>>>0);n++}return k})();
function sha256(str){
 const m=new TextEncoder().encode(str),l=m.length,tot=((l+9+63)>>6)<<6,b=new Uint8Array(tot);b.set(m);b[l]=0x80;
 const dv=new DataView(b.buffer);dv.setUint32(tot-8,Math.floor(l*8/4294967296));dv.setUint32(tot-4,(l*8)>>>0);
 let h=SHA_H.slice();const w=new Uint32Array(64);
 const rr=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<tot;o+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let [a,b2,c,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){
   const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+SHA_K[i]+w[i])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)>>>0;
   hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0;
  }
  h=[(h[0]+a)>>>0,(h[1]+b2)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];
 }
 return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function hashPin(pin,salt){let h=sha256(salt+':'+pin);for(let i=0;i<1999;i++)h=sha256(h+salt);return h}
function rndSalt(){try{const a=new Uint8Array(12);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)+Date.now()}}

function audit(a,d,who){
 const u=who||ME,L=DB.log,prev=L.length?L[L.length-1].h:'GENESIS',n=L.length+1,t=nowISO(),mh=DB.moves.length?DB.moves[DB.moves.length-1].h:'';
 const e={n,t,u:u?u.id:0,un:u?u.name:'النظام',a,d:d===undefined?'':d,mh,prev};
 e.h=sha256([prev,n,t,e.u,a,JSON.stringify(e.d),mh].join('|'));
 L.push(e);
 if(isOwner()&&MEKEY&&!SEALHOLD)sealNow();

const usersHash=()=>sha256(JSON.stringify(DB.users.map(u=>[u.id,u.name,u.role,u.hash,u.active!==false,u.perms||null]))+(DB.approval?DB.approval.hash:''));

function moveStock(it,delta,why,ref){
 it.qty=(+it.qty||0)+delta;
 const prev=DB.moves.length?DB.moves[DB.moves.length-1].h:'M0',id=uid(),t=nowISO();
 const m={id,t,item:it.id,name:it.name,d:delta,after:it.qty,why,ref:ref||0,u:ME?ME.id:0,un:ME?ME.name:'النظام',prev};
 m.h=sha256([prev,id,t,it.id,delta,it.qty,why,m.u].join('|'));
 DB.moves.push(m);return m;
}
function rebase(){ // يخلّي سجل الحركة متطابق مع الكميات الحالية
 DB.items.filter(i=>!i.service).forEach(i=>{
  const ms=DB.moves.filter(m=>m.item===i.id),last=ms.length?ms[ms.length-1].after:0;
  if(last!==i.qty)moveStock(i,0,'رصيد افتتاحي / مطابقة',0),DB.moves[DB.moves.length-1].d=i.qty-last,
   (m=>{m.h=sha256([m.prev,m.id,m.t,m.item,m.d,m.after,m.why,m.u].join('|'))})(DB.moves[DB.moves.length-1]);
 });
}

// ---- فحص السلامة ----
function verifyAll(key){
 const I=[],L=DB.log;let prev='GENESIS',lt=0;
 L.forEach((e,i)=>{
  const h=sha256([prev,e.n,e.t,e.u,e.a,JSON.stringify(e.d),e.mh||''].join('|'));
  if(e.n!==i+1||e.prev!==prev||e.h!==h){if(!I.some(x=>x.startsWith('⛔ السجل')))I.push('⛔ السجل اتعدّل أو اتمسح منه حاجة عند الحركة رقم '+(i+1));}
  const tm=Date.parse(e.t)||0;if(tm<lt-300000&&!I.some(x=>x.includes('الساعة')))I.push('🕒 ساعة الجهاز اتغيّرت (حركة بتاريخ أقدم من اللي قبلها) عند الحركة '+e.n);
  lt=Math.max(lt,tm);prev=e.h;
 });
 // ختم المالك
 if(DB.seal&&key){
  const s=DB.seal,mac=sha256(['seal',key,s.n,s.h,s.uh].join('|'));
  if(mac!==s.mac)I.push('⛔ ختم المالك اتغيّر — حد لعب في البيانات من برّه البرنامج');
  else{
   if(!L[s.n-1]||L[s.n-1].h!==s.h)I.push('⛔ السجل اتقصّ أو اتبدّل بعد آخر مرة دخلت فيها');
   if(usersHash()!==s.uh)I.push('⛔ المستخدمين أو الصلاحيات اتغيّروا من برّه البرنامج');
  }
 }else if(key&&!DB.seal&&L.length)I.push('⚠️ مفيش ختم سابق (أول فحص)');
 // الفواتير والمصروفات مقابل السجل
 let b=0;L.forEach((e,i)=>{if(e.a==='restore'||e.a==='wipe')b=i+1});
 const sl=new Map(),voided=new Set(),el=new Map(),eld=new Set();
 L.forEach((e,i)=>{if(!e.d)return;if(e.a==='sale')sl.set(e.d.id,{e,i});if(e.a==='void')voided.add(e.d.id);if(e.a==='exp')el.set(e.d.id,{e,i});if(e.a==='expdel')eld.add(e.d.id)});
 DB.sales.forEach(s=>{const r=sl.get(s.id);if(!r)I.push('🧾 فاتورة #'+s.id+' موجودة من غير سجل (اتضافت من برّه)');else if(r.e.d.h!==saleHash(s))I.push('🧾 فاتورة #'+s.id+' اتعدّلت بعد ما اتسجلت')});
 sl.forEach((r,id)=>{if(r.i>=b&&!voided.has(id)&&!DB.sales.some(s=>s.id===id))I.push('🧾 فاتورة #'+id+' اتشالت من غير إلغاء مسجل')});
 DB.expenses.forEach(x=>{const r=el.get(x.id);if(!r)I.push('💸 مصروف "'+x.name+'" من غير سجل');else if(+r.e.d.amount!==+x.amount)I.push('💸 مصروف "'+x.name+'" اتغيّر مبلغه')});
 el.forEach((r,id)=>{if(r.i>=b&&!eld.has(id)&&!DB.expenses.some(x=>x.id===id))I.push('💸 مصروف رقم '+id+' اتشال من غير سجل')});
 const ll=new Map(),lld=new Set();L.forEach((e,i)=>{if(!e.d)return;if(e.a==='loss')ll.set(e.d.id,{e,i});if(e.a==='lossdel')lld.add(e.d.id)});
 DB.losses.forEach(x=>{const r=ll.get(x.id);if(!r)I.push('🗑️ هالك "'+x.name+'" من غير سجل');else if(+r.e.d.amount!==+x.amount)I.push('🗑️ هالك "'+x.name+'" اتغيّر مبلغه')});
 ll.forEach((r,id)=>{if(r.i>=b&&!lld.has(id)&&!DB.losses.some(x=>x.id===id))I.push('🗑️ هالك رقم '+id+' اتشال من غير سجل')});
 const pr=new Map(),prd=new Set();L.forEach((e,i)=>{if(!e.d)return;if(e.a==='payroll')pr.set(e.d.id,{e,i});if(e.a==='payrolldel')prd.add(e.d.id)});
 DB.payroll.forEach(x=>{const r=pr.get(x.id);if(!r)I.push('👷 حركة مرتب '+x.wn+' من غير سجل');else if(+r.e.d.amount!==+x.amount)I.push('👷 مبلغ حركة مرتب '+x.wn+' اتغيّر')});
 pr.forEach((r,id)=>{if(r.i>=b&&!prd.has(id)&&!DB.payroll.some(x=>x.id===id))I.push('👷 حركة مرتب رقم '+id+' اتشالت من غير سجل')});
 // المخزون
 let mp='M0';DB.moves.forEach(m=>{const h=sha256([m.prev,m.id,m.t,m.item,m.d,m.after,m.why,m.u].join('|'));if(m.prev!==mp||m.h!==h){if(!I.some(x=>x.includes('سجل المخزون')))I.push('⛔ سجل المخزون اتعدّل');}mp=m.h});
 if(L.length&&(L[L.length-1].mh||'')!==(DB.moves.length?DB.moves[DB.moves.length-1].h:''))I.push('⛔ سجل المخزون اتغيّر بعد آخر حركة مسجلة');
 DB.items.filter(i=>!i.service).forEach(i=>{
  const ms=DB.moves.filter(m=>m.item===i.id),last=ms.length?ms[ms.length-1].after:0;
  if(last!==i.qty)I.push('📦 رصيد "'+i.name+'" اتغيّر من برّه: السجل '+last+' والموجود '+i.qty);
  if(i.qty<0)I.push('📦 رصيد "'+i.name+'" بالسالب');
 });
 return I;
}

function genRK(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(16);crypto.getRandomValues(b);let k='';b.forEach((x,i)=>{k+=A[x%A.length];if(i%4===3&&i<15)k+='-'});return k}

function cashFor(d){
 const isC=m=>!m||m==='cash',pd=s=>s.paid0??s.paid??saleTotal(s),
  inS=DB.sales.filter(s=>s.date===d&&isC(s.method)).reduce((a,s)=>a+pd(s),0),
  inO=DB.sales.filter(s=>s.date===d&&!isC(s.method)).reduce((a,s)=>a+pd(s),0)+DB.custPay.filter(p=>p.date===d&&!isC(p.method)).reduce((a,p)=>a+p.amount,0),
  inP=DB.custPay.filter(p=>p.date===d&&isC(p.method)).reduce((a,p)=>a+p.amount,0),
  outE=DB.expenses.filter(e=>e.date===d).reduce((a,e)=>a+e.amount,0),
  outW=wageSum(d,d),outP=DB.purchases.filter(p=>p.date===d).reduce((a,p)=>a+(p.paid||0),0)+DB.supPay.filter(p=>p.date===d).reduce((a,p)=>a+p.amount,0);
 return{inS,inO,inP,outE,outW,outP,exp:inS+inP-outE-outW-outP};
}

function carsForm(){
 const C=CARDB();
 openModal(`<h2>🚗 ماركات وموديلات العربيات</h2><div style="max-height:50vh;overflow:auto">${C.map((b,i)=>`<div class="cart-i"><span onclick="carModels(${i})" style="cursor:pointer;flex:1">${bLogo(b[0],28)}<b>${esc(b[0])}</b> <small style="color:var(--mut)">${b[1].length} موديل · ${brandCount(b[0])} صنف</small></span><span><button class="btn s o" data-b="${esc(b[0])}" onclick="carLogoPick(this.dataset.b)">🖼️</button> ${(DB.carLogo||{})[b[0]]?`<button class="btn s o" data-b="${esc(b[0])}" onclick="carLogoDel(this.dataset.b)">🚫</button> `:''}<button class="btn s o" onclick="carModels(${i})">📂</button> <button class="btn s o" onclick="carBrandRename(${i})">✏️</button> <button class="btn s d" onclick="carBrandDel(${i})">✕</button></span></div>`).join('')}</div>
 <label>ماركة جديدة</label><input id="cb_n"><div class="row"><button class="btn k" onclick="carBrandAdd()">+ إضافة</button><button class="btn o" onclick="closeModal();render()">تم</button></div>`);
}
function carBrandAdd(){const n=$('#cb_n').value.trim();if(!n)return;if(brandNames().includes(n)){alert('الماركة موجودة');return}carW().push([n,[]]);audit('car','إضافة ماركة '+n);carsForm()}
function carBrandRename(i){const old=CARDB()[i][0],n=(prompt('الاسم الجديد:',old)||'').trim();if(!n||n===old)return;if(brandNames().includes(n)){alert('موجود');return}carW()[i][0]=n;if(DB.carLogo&&DB.carLogo[old]){DB.carLogo[n]=DB.carLogo[old];delete DB.carLogo[old]}DB.items.forEach(x=>{if(x.brand===old)x.brand=n});if(sellBrand===old)sellBrand=n;audit('car','تغيير ماركة '+old+' → '+n);carsForm()}
function carBrandDel(i){const b=CARDB()[i][0],c=brandCount(b);if(!confirm('مسح الماركة "'+b+'"'+(c?' ('+c+' صنف هيتشال منهم الماركة بس)':'')+'؟'))return;carW().splice(i,1);if(DB.carLogo)delete DB.carLogo[b];DB.items.forEach(x=>{if(x.brand===b){delete x.brand;delete x.model}});if(sellBrand===b)sellBrand='';audit('car','مسح ماركة '+b);carsForm()}
function carModels(i){
 const b=CARDB()[i];
 openModal(`<h2>🚗 ${esc(b[0])}</h2><div style="max-height:50vh;overflow:auto">${b[1].map((m,j)=>`<div class="cart-i"><span>${esc(m)} <small style="color:var(--mut)">(${DB.items.filter(x=>x.brand===b[0]&&x.model===m).length})</small></span><span><button class="btn s o" onclick="carModelRename(${i},${j})">✏️</button> <button class="btn s d" onclick="carModelDel(${i},${j})">✕</button></span></div>`).join('')||'<div class="empty">مفيش موديلات</div>'}</div>
 <label>موديل جديد</label><input id="cm_n" placeholder="مثال: كورولا 2020"><div class="row"><button class="btn k" onclick="carModelAdd(${i})">+ إضافة</button><button class="btn o" onclick="carsForm()">رجوع</button></div>`);
}
function carModelAdd(i){const n=$('#cm_n').value.trim();if(!n)return;const w=carW()[i];if(w[1].includes(n)){alert('موجود');return}w[1].push(n);audit('car','إضافة موديل '+n+' إلى '+w[0]);carModels(i)}
function carModelRename(i,j){const w=carW()[i],old=w[1][j],n=(prompt('الاسم الجديد:',old)||'').trim();if(!n||n===old)return;if(w[1].includes(n)){alert('موجود');return}w[1][j]=n;DB.items.forEach(x=>{if(x.brand===w[0]&&x.model===old)x.model=n});audit('car','تغيير موديل '+old+' → '+n);carModels(i)}
function carModelDel(i,j){const w=carW()[i],m=w[1][j];if(!confirm('مسح الموديل "'+m+'"؟'))return;w[1].splice(j,1);DB.items.forEach(x=>{if(x.brand===w[0]&&x.model===m)delete x.model});if(sellModel===m)sellModel='';audit('car','مسح موديل '+m);carModels(i)}

// بيانات تجريبية أول مرة
if(!DB.items.length&&!DB.sales.length){
 [['مفتاح عادي خام',CATS[0],100,2,10],['مفتاح أمان خام',CATS[0],60,6,30],['ريموت سيارة عام',CATS[2],10,150,400],['كالون باب',CATS[3],12,120,220],['قفل حديد',CATS[3],20,40,90]]
 .forEach(([n,c,q,k,p])=>DB.items.push({id:uid(),name:n,cat:c,service:false,qty:q,cost:k,price:p}));
 addMissingServices();
 save();
}
if(!DB.labor2){addMissingServices();DB.labor2=1;save()}
navInit();boot();
setTimeout(hideSplash,2200);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
